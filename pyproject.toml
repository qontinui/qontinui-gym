[tool.poetry]
name = "qontinui-gym"
version = "0.1.0"
description = "Gymnasium environments for visual GUI automation with Qontinui"
authors = ["Joshua Spinak"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/qontinui/qontinui-gym"
repository = "https://github.com/qontinui/qontinui-gym"
keywords = ["gymnasium", "reinforcement-learning", "gui-automation", "qontinui", "rl", "visual-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
packages = [{include = "qontinui_gym", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
gymnasium = "^1.0.0"
numpy = ">=1.26,<3.0"
requests = "^2.31"
pillow = "^10.0"
networkx = "^3.0"

[tool.poetry.extras]
vision = ["opencv-python-headless"]
sb3 = ["stable-baselines3"]
all = ["opencv-python-headless", "stable-baselines3"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
isort = "^5.13.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
