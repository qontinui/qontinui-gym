name: qontinui CI

# The workflow name is the check context coord's merge engine reads. Keep it
# stable ("qontinui CI") — renaming it orphans the recorded CI baseline.

# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `main` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured on
# qontinui-docs and this repo, which BOTH carried `cancel-in-progress: true` when
# that measurement was taken and still emitted both runs at one SHA. Stated in
# the past tense deliberately: it is a record of the evidence, not a claim about
# what those files carry today (both have since taken the guard below). Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:

# CANCEL ONLY THE PR LANE. `cancel-in-progress` must NOT be a bare `true` here.
# Scoping the `push:` trigger above left `main` and `merge-candidate*` as the
# ONLY branches a push run can fire on, so blanket cancellation no longer sheds
# redundant work - it sheds runs on the two ref classes coord's merge engine
# reads. This repo is a live train repo: `merge-candidate/*` and
# `merge-candidate-spec/*` pushes are in its own run history.
#
#   - `merge-candidate*`. coord's stated convention for candidate refs is
#     `cancel-in-progress: false`, verbatim in the candidate-CI workflow it holds
#     as the shape every train repo should carry (`ci_baseline.rs`
#     COORD_CANDIDATE_CI_WORKFLOW_YAML): "a candidate re-push mid-run is rare and
#     a duplicate run is cheaper than a half-reported check set". The train mints
#     `merge-candidate/<proposal_id>` from the proposal id and a requeue re-pushes
#     the SAME ref (`merge_scheduler.rs` `revert_claim_to_queued` /
#     `on_base_mismatch`), so the group DOES collide across attempts. The verdict
#     is head_sha scoped, so a cancelled older run is not misread as the new
#     attempt's answer - the cost is the wasted run and the requeue churn.
#   - `main`. The group resolves to `qontinui CI-refs/heads/main`, exactly the
#     group a prospective land's `(push, refs/heads/main)` event resolves into, so
#     every in-flight main run is `reaper_at_risk` by `ci_observer.rs`
#     `run_is_reaper_at_risk`. coord already models the reap that happens even at
#     `false` (GitHub reaps the oldest PENDING run in a group); `true` upgrades
#     that from "queued behind" to an actual cancellation, leaving a `cancelled`
#     conclusion on a main SHA whose baseline coord reads as non-success.
#     `qontinui CI` is not on `BENIGN_SUPERSESSION_WORKFLOWS`, so nothing
#     downgrades it.
#
#     The window is small but real, not theoretical: main runs here take 91-118 s
#     (runs 33365463352, 29929312191, 29927602314) and the train lands
#     back-to-back with COORD_MERGE_SLOTS=3 - on 2026-07-22 it pushed main at
#     14:14:12Z with candidate runs still in flight seconds either side.
#
# Be honest about the size of it: every tree the train lands has already been
# built green before it lands, so the verdict a cancel destroys here is usually a
# redundant one. What makes it worth closing is that it is destroyed SILENTLY -
# `ci_baseline.rs` `ingest_workflow_run` returns before the write when
# `is_supersession_conclusion` matches (`cancelled` | `stale`), so the baseline
# quietly keeps its last conclusive verdict. That guard is a downstream
# compensation living in one consumer; the invariant belongs at the producer,
# which is this file.
#
# `pull_request` is the one lane where cancelling is safe: coord excludes PR-lane
# runs from the no-reap blocking set (`ci_observer.rs` `is_excluded_from_blocking`
# - "a main push neither cancels nor invalidates a PR run") and reads PR checks
# through `coord.pr_check_runs_latest`, partitioned by `(repo, head_sha, name)`,
# so the superseded attempt sits in a different partition and is never consulted
# for the new head. The saving is modest on a ~2-minute Python job - this change
# is made for the hazard above, not for the runner minutes.
#
# THE GROUP'S PRECONDITION. `cancel-in-progress` keys on the EVENT; the group
# keys only on the REF. That is sufficient only because no two triggers here can
# put different event kinds on one ref (`push` -> `refs/heads/<branch>`,
# `pull_request` -> `refs/pull/<n>/merge`). Add a `workflow_dispatch:` trigger and
# it stops holding - a dispatch on `main` joins `qontinui CI-refs/heads/main`. If
# you add one, key the GROUP by `github.event_name` too, as
# `qontinui-coord/.github/workflows/ci.yml` does.
#
# Note for anyone reading coord's cached view of this file: `parse_concurrency`
# matches only the literals `true`/`True`/`yes`, so it records this expression as
# `cancel_in_progress: false`. That field is observability only - no gate reads
# it, and `run_is_reaper_at_risk` keys on the GROUP alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Project standard for Python repos (see the monorepo CLAUDE.md). The
  # bootstrap workflow this replaces used `python-version: '3.x'`, which the
  # hosted runners now resolve to 3.14 — nothing in this dependency tree
  # publishes 3.14 wheels yet, so pip fell back to building Pillow from source
  # and died on missing libjpeg headers. Pin the interpreter, don't track latest.
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Poetry must exist before setup-python so `cache: poetry` can resolve the
      # lockfile. Pinned to the 2.x line: 3.x may change the lock format, which
      # would silently invalidate poetry.lock.
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      # Fails if pyproject.toml and poetry.lock have drifted. This repo shipped
      # an invalid pyproject (extras naming dependencies that were never
      # declared) alongside a stale lock, and nothing validated either. Run this
      # before install so a drift failure names its real cause.
      - name: Validate pyproject + lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Test
        run: poetry run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Ruff
        run: poetry run ruff check .

      # pyproject sets `[tool.mypy] strict = true`. Without a gate that setting
      # was aspirational, and 23 errors had accumulated behind it.
      - name: Mypy
        run: poetry run mypy src
